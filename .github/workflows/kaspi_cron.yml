name: Kaspi Auto Update Cron

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch: # Позволяет запускать робота вручную кнопкой

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Script
      run: python fix_prices.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@://github.com"
        git add kaspi.xml
        git diff-index --quiet HEAD || git commit -m "Автоматическое обновление прайса Kaspi"
        git push
