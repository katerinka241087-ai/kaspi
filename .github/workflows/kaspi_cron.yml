name: Kaspi Auto Update Cron

on:
  schedule:
    # Запуск каждые 3 часа
    - cron: '0 */3 * * *'
  workflow_dispatch: # Позволяет запускать робота вручную кнопкой

jobs:
  run-updater:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: pip install requests

    - name: Run Script
      run: python fix_prices.py

    - name: Commit and Push XML
      run: |
        git config --global user.name "Kaspi Cloud Bot"
        git config --global user.email "cloud-bot@kaspi.local"
        git add kaspi.xml
        git diff --quiet && git diff --staged --quiet || (git commit -m "Авто-обновление из облака: $(date +'%Y-%m-%d %H:%M:%S')" && git push)
